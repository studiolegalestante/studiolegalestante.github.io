name: Indici FOI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 20 * *'   # il 20 di ogni mese, dopo la pubblicazione ISTAT

permissions:
  contents: write

jobs:
  foi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - name: Scarica gli indici
        run: python scripts/indici_foi.py
      - name: Salva se cambiati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/foi.json
          git diff --cached --quiet && echo "Nessuna modifica" || (git commit -m "Aggiorna indici FOI [skip ci]" && git push)
