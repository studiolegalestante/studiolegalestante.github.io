name: Verifica fonti notizie

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install requests feedparser
      - run: python scripts/verifica_fonti.py
